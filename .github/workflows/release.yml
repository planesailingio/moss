# Release: build archives for five targets on a `v*` tag, publish them as a
# GitHub release, then update the Homebrew tap.
#
# Credentials:
#   The `tap` job pushes to planesailingio/homebrew-tools, which the default
#   GITHUB_TOKEN cannot do (it is scoped to this repository only). It mints a
#   short-lived installation token for the org's tap GitHub App instead, from
#   two org-level values shared with the tool repositories:
#     vars.TAP_APP_ID              — the app's App ID or client ID (not secret)
#     secrets.TAP_APP_PRIVATE_KEY  — the app's private key (.pem contents)
#   The app is installed on homebrew-tools only, with "Contents: read and
#   write". Rotate by generating a new private key on the app's settings page
#   and replacing the org secret; nothing else references it.
#
# See docs/releasing.md for the release procedure and the dry run.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="moss_${version}_${{ matrix.target }}"
          mkdir -p "dist/$name/bin"
          cp "target/${{ matrix.target }}/release/moss" "dist/$name/bin/moss"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" | awk '{print $1}' > "dist/$name.tar.gz.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $name = "moss_${version}_${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name/bin" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/moss.exe" "dist/$name/bin/moss.exe"
          Copy-Item README.md,LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii "dist/$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          # v0.1.0-rc1 and friends are prereleases; the tap only follows finals.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  tap:
    name: update homebrew tap
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mint tap app token
        id: tap-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: planesailingio
          repositories: homebrew-tools
      - name: Render Formula/moss.rb and push to planesailingio/homebrew-tools
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: MOSS_TAP_CONFIRM=1 scripts/update-tap.sh "${GITHUB_REF_NAME#v}"
