[package]
name = "moss"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "OS-agnostic user-profile backup and restore on top of Kopia."
repository = "https://github.com/planesailingio/moss"
homepage = "https://github.com/planesailingio/moss"
readme = "README.md"
keywords = ["backup", "kopia", "profile", "dotfiles", "cli"]
categories = ["command-line-utilities"]

[dependencies]
bip39 = { version = "2", features = ["std", "zeroize"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
directories = "6"
getrandom = "0.4"
ignore = "0.4"
indicatif = "0.18"
keyring = "4"
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
which = "8"
zeroize = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
ulid = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }
known-folders = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["json", "yaml"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
